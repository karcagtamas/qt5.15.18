#
# qmake configuration for building with aarch64-linux-gnu-g++
#

MAKEFILE_GENERATOR      = UNIX
CONFIG                 += incremental
QMAKE_INCREMENTAL_STYLE = sublib

include(../common/linux.conf)
include(../common/gcc-base-unix.conf)
include(../common/g++-unix.conf)

# modifications to g++.conf
QMAKE_CC                = aarch64-linux-gnu-gcc
QMAKE_CXX               = aarch64-linux-gnu-g++
QMAKE_LINK              = aarch64-linux-gnu-g++
QMAKE_LINK_SHLIB        = aarch64-linux-gnu-g++

# modifications to linux.conf
QMAKE_AR                = aarch64-linux-gnu-ar cqs
QMAKE_OBJCOPY           = aarch64-linux-gnu-objcopy
QMAKE_NM                = aarch64-linux-gnu-nm -P
QMAKE_STRIP             = aarch64-linux-gnu-strip
load(qt_config)

# ---- RPi Trixie EGL/GLES2 block ----
QMAKE_INCDIR_EGL        = $$[SYSROOT]/usr/include
QMAKE_LIBDIR_EGL        = $$[SYSROOT]/usr/lib/aarch64-linux-gnu
QMAKE_LIBS_EGL          = -lEGL -lGLESv2 -ldrm -lgbm

QMAKE_INCDIR_OPENGL_ES2 = $$[SYSROOT]/usr/include
QMAKE_LIBDIR_OPENGL_ES2 = $$[SYSROOT]/usr/lib/aarch64-linux-gnu
QMAKE_LIBS_OPENGL_ES2   = -lGLESv2 -lEGL -ldrm -lgbm
# ---- end RPi Trixie EGL/GLES2 block ----
